version: 2
project_name: snapshots

builds:
  - id: snapshots
    main: ./cmd/snapshots
    binary: snapshots
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "snapshots_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  disable: true   # release notes are generated by GitHub

release:
  disable: true   # the workflow creates the release, so notes and attestations stay in one place
