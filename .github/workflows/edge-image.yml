name: Edge image

# Publishes ghcr.io/degenview/snapshots:edge (and :sha-<commit>) after CI passes on main, so the
# latest main can be run without cutting a release. Versioned tags and :latest come only from the
# manual Release workflow; this one never touches them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# A newer main replaces an older build that is still running.
concurrency:
  group: edge-image
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push :edge
    # Only a push to main that passed CI (not a pull request, not a release's own CI call).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push the image
      id-token: write       # provenance attestation
      attestations: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Skip if main has moved on
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $head, not $SHA: a newer run will publish."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.fresh.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - if: steps.fresh.outputs.current == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.fresh.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.fresh.outputs.current == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: short
        if: steps.fresh.outputs.current == 'true'
        run: echo "sha=${SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        if: steps.fresh.outputs.current == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/degenview/snapshots
          tags: |
            type=raw,value=edge
            type=raw,value=sha-${{ steps.short.outputs.sha }}
      - id: image
        if: steps.fresh.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=edge-${{ steps.short.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - if: steps.fresh.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/degenview/snapshots
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
